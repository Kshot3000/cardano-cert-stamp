<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1d3a" />
  <meta name="referrer" content="no-referrer" />
  <title>Check a certificate · Cert Stamp</title>
  <link rel="icon" href="./icon.svg" />
</head>
<body>
  <main id="app">
    <header class="top"><a href="./index.html" class="back">← Cert Stamp</a><h1>Check a certificate</h1></header>
    <div id="banner"></div>
    <section id="input" class="panel">
      <button id="scanBtn" type="button" class="big">Scan QR code</button>
      <div id="scanWrap" hidden>
        <video id="video" muted playsinline></video>
        <button id="stopScan" type="button" class="secondary">Stop camera</button>
      </div>
      <label class="upload">Or choose a photo of the QR code <input id="qrFile" type="file" accept="image/*" /></label>
      <form id="pasteForm" class="row">
        <input id="pasteInput" type="text" inputmode="url" placeholder="…or paste the verify link" aria-label="Verify link" />
        <button type="submit">Check</button>
      </form>
    </section>
    <section id="result" aria-live="polite"></section>
    <div id="footer"></div>
  </main>
  <script type="module" src="./src/verify-page.js"></script>
</body>
</html>
